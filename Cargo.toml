[workspace]
resolver = "3"
members = ["crates/godot-dev-tools", "crates/gdt", "crates/gdt-shim"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roxguel/godot-dev-tools"
homepage = "https://github.com/roxguel/godot-dev-tools"
authors = ["Roxguel"]

[workspace.dependencies]
godot-dev-tools = { path = "crates/godot-dev-tools", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
