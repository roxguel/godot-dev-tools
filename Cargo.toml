[workspace]
resolver = "3"
members = ["crates/godot-dev-tools", "crates/gdt"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roxguel/godot-dev-tools"
homepage = "https://github.com/roxguel/godot-dev-tools"
authors = ["Roxguel"]

[workspace.dependencies]
godot-dev-tools = { path = "crates/godot-dev-tools", version = "0.1.1" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
console = "0.16"
ctrlc = "3"
winreg = "0.56"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
toml = "1"
toml_edit = "0.25"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
