# Settings for cargo-about, which writes THIRD-PARTY-NOTICES.txt (see about.hbs).
# The release workflow runs it and puts the file in every archive: the licenses of the
# dependencies ask for their copyright notice and license text to travel with a binary.
# `deny.toml` is the gate for which licenses may come in; keep the two lists in step.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# The six release targets (see .github/workflows/release.yml); a crate that none of them
# builds is left out.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

ignore-dev-dependencies = true
ignore-build-dependencies = true
