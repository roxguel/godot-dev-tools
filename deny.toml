[graph]
all-features = true

[advisories]
version = 2
# A yanked crate was pulled by its author, usually for a bug or a security problem.
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# The Mozilla root certificate bundle used for HTTPS is licensed under the
# Community Data License Agreement Permissive 2.0 (a permissive data license).
# Allowed for that one crate only.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
