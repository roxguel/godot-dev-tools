name: Advisories

# New security advisories are published against crates and npm packages that a project
# already uses, so a check that runs only on pushes and pull requests misses them while
# the project is quiet. This one runs every week, and by hand, against what is already on
# main. A failure here is a published advisory (or a yanked crate) to act on, not a
# problem with a change.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the tag is in the comment);
# Dependabot keeps them up to date.
jobs:
  rust:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  site:
    name: Site dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
      - name: Audit
        working-directory: site
        run: pnpm audit --audit-level=moderate
