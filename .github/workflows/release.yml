name: Release

# Pushing a tag such as v0.1.0 builds gdt for six targets, checks that the tag
# matches the version in Cargo.toml, and publishes a GitHub release with the
# archives, a SHA256SUMS file and build provenance attestations. A tag without a
# hyphen (not a pre-release) is then also published to crates.io, after a second
# approval of the `release` environment, and pull requests update the Homebrew tap
# and the Scoop bucket.
#
# A pull request that changes this file, or a manual run, builds everything and
# publishes nothing: that is how the workflow itself is tested.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

# Read-only by default; only the publishing job gets more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Release binaries are built with one fixed compiler, not whatever "stable" is
  # that day (it also overrides `rust-toolchain.toml`). Raise it by hand when
  # preparing a release.
  RUSTUP_TOOLCHAIN: "1.99.1"

# Third-party actions are pinned to a full commit SHA (the tag is in the comment).
jobs:
  # The licenses of the libraries gdt is built with ask for their copyright notice and
  # license text to travel with the binary. This writes them once; every archive gets
  # the file. cargo-about is built from crates.io at a pinned version, from its lockfile.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Write THIRD-PARTY-NOTICES.txt
        run: cargo about generate --locked --fail -m crates/gdt/Cargo.toml -c about.toml -o THIRD-PARTY-NOTICES.txt about.hbs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: notices
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, smoke: true }
          # Static (musl) Linux binaries run on any distribution, old or new.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, smoke: true, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: true, musl: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          # Built on an Apple silicon runner, so it is not run here.
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install the musl C toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Check the version
        id: version
        shell: bash
        run: |
          version=$(cargo pkgid -p gdt | sed 's/.*[#@]//')
          echo "gdt is version $version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p gdt --target ${{ matrix.target }}

      - name: Check that the Linux binary is static
        if: matrix.musl
        run: |
          file "target/${{ matrix.target }}/release/gdt"
          file "target/${{ matrix.target }}/release/gdt" | grep -Eq "statically linked|static-pie linked"

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/gdt"
          [[ "${{ matrix.target }}" == *windows* ]] && exe="$exe.exe"
          out=$("$exe" --version)
          echo "$out"
          [[ "$out" == "gdt ${{ steps.version.outputs.version }}" ]]
          "$exe" paths > /dev/null

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "gdt-v${{ steps.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory "dist/$name" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gdt.exe", LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.txt, README.md "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item "dist/$name" -Recurse

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          name="gdt-v${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/gdt" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdt-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Publishing waits for the maintainer's approval: the `release` environment
    # (Settings > Environments) must list a required reviewer.
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      # Only what has been merged into main is released, whatever the tag says.
      - name: Check that the tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          echo "the tagged commit is '$status' relative to main"
          # "behind" and "identical" mean the commit is already part of main.
          [[ "$status" == "behind" || "$status" == "identical" ]] || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gdt-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum gdt-v* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gdt-v*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          # A tag such as v0.2.0-rc1 is a pre-release.
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "gdt ${GITHUB_REF_NAME#v}" \
            "${flags[@]}"

  # crates.io trusted publishing: crates.io checks the OIDC token of this run (the
  # repository, this workflow file and the `release` environment, as registered on each
  # crate's settings page) and hands out a token that lasts a few minutes, so no secret
  # is stored. A pre-release tag is not published there. This job is its own approval of
  # the `release` environment, and it can be re-run alone if it fails.
  crates:
    name: Publish to crates.io
    needs: publish
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # prove to crates.io that this run is the registered workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish both crates, the library first
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  # Opens a pull request in the Homebrew tap and in the Scoop bucket with the new
  # version. The pull requests are merged by the maintainer, and the token that opens
  # them only reaches those two repositories (see packaging/README.md). Without the
  # secret the job warns and does nothing.
  packaging:
    name: Update the tap and the bucket
    needs: publish
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the manifests from the release's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          node packaging/render.mjs "$version" SHA256SUMS out "$(date -u +%F)"

      - name: Open the pull requests
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::PACKAGING_TOKEN is not set: the tap and the bucket were not updated"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          update() { # repository, rendered file, path inside the repository
            local repo="$1" source="$2" target="$3" branch="gdt-$version"
            gh repo clone "roxguel/$repo" "work/$repo" -- --depth 1
            (
              cd "work/$repo"
              git switch -c "$branch"
              mkdir -p "$(dirname "$target")"
              cp "$GITHUB_WORKSPACE/out/$source" "$target"
              if [[ -z "$(git status --porcelain -- "$target")" ]]; then
                echo "$repo is already at gdt $version"
                exit 0
              fi
              git add "$target"
              git commit -m "feat(gdt): update to $version"
              git push origin "$branch"
              gh pr create --repo "roxguel/$repo" --base main --head "$branch"                 --title "feat(gdt): update to $version"                 --body "gdt $version, rendered from the SHA256SUMS of https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            )
          }
          update homebrew-tap homebrew/gdt.rb Formula/gdt.rb
          update scoop-bucket scoop/gdt.json bucket/gdt.json
